AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Plataforma de Donaciones Seguras (2026) - Fundacion AQP-SOLIDARIA
  Arquitectura Serverless Zero Trust (NIST SP 800-207)

Parameters:
  Stage:
    Type: String
    Default: academic
    AllowedValues:
      - academic
      - prod
    Description: Stage de despliegue. El endpoint de simulacion solo existe en el stage academic.

Conditions:
  IsAcademicStage: !Equals [!Ref Stage, academic]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: !Ref Stage
        PROJECTS_TABLE: !Ref ProjectsTable
        DONATIONS_TABLE: !Ref DonationsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        AUDIT_TABLE: !Ref AuditEventsTable
        NODE_OPTIONS: "--enable-source-maps"

Resources:
  # ============================================================================
  # TABLAS DYNAMODB (Capacidad On-Demand / Free Tier)
  # ============================================================================
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "donations-projects-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DonationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "donations-donations-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donationId
          AttributeType: S
        - AttributeName: donorSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: donationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DonorSubCreatedAtIndex
          KeySchema:
            - AttributeName: donorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "donations-idempotency-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "donations-audit-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: eventSk
          AttributeType: S
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: eventSk
          KeyType: RANGE

  # ============================================================================
  # IDENTIDAD Y ACCESO: AMAZON COGNITO
  # ============================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "aqp-solidaria-users-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OPTIONAL"
      EnabledMfas:
        - "SOFTWARE_TOKEN_MFA"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  UserPoolGroupDonante:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: DONANTE
      Description: Donantes verificados
      UserPoolId: !Ref UserPool
      Precedence: 10

  UserPoolGroupGestor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: GESTOR
      Description: Gestores de proyectos sociales con MFA obligatorio
      UserPoolId: !Ref UserPool
      Precedence: 5

  UserPoolGroupAuditor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: AUDITOR
      Description: Auditores tecnicos con MFA obligatorio
      UserPoolId: !Ref UserPool
      Precedence: 1

  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: api
      Name: Donations Api Scopes
      UserPoolId: !Ref UserPool
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Creacion y publicacion de proyectos
        - ScopeName: donations.read
          ScopeDescription: Lectura de historial propio de donaciones
        - ScopeName: donations.write
          ScopeDescription: Registro y confirmacion de donaciones
        - ScopeName: audit.read
          ScopeDescription: Lectura de bitacora de auditoria

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      ClientName: !Sub "spa-client-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - api/projects.write
        - api/donations.read
        - api/donations.write
        - api/audit.read
      CallbackURLs:
        - http://localhost:5173/callback
        - http://localhost:5173
        - https://d4twnz6gxwdr2.cloudfront.net/callback
        - https://d4twnz6gxwdr2.cloudfront.net
      LogoutURLs:
        - http://localhost:5173
        - https://d4twnz6gxwdr2.cloudfront.net
      SupportedIdentityProviders:
        - COGNITO
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      EnableTokenRevocation: true

  # ============================================================================
  # API GATEWAY HTTP API
  # ============================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
          - Idempotency-Key
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # ============================================================================
  # FUNCIONES LAMBDA (Privilegio Minimo IAM)
  # ============================================================================
  ProjectsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/projects/list.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${ProjectsTable.Arn}/index/StatusCreatedAtIndex"
      Events:
        GetProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects
            Method: GET

  ProjectGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/projects/get.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt ProjectsTable.Arn
      Events:
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}
            Method: GET

  ProjectCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/projects/create.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !GetAtt AuditEventsTable.Arn
      Events:
        CreateProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - api/projects.write

  ProjectPublishFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/projects/publish.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt AuditEventsTable.Arn
      Events:
        PublishProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}/publish
            Method: PATCH
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - api/projects.write

  ProjectListAllGestorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/projects/listAllGestor.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource:
                - !GetAtt ProjectsTable.Arn
      Events:
        ListAllGestor:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/all
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - api/projects.write

  DonationCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/donations/create.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !GetAtt IdempotencyTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt DonationsTable.Arn
                - !GetAtt IdempotencyTable.Arn
      Events:
        CreateDonation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - api/donations.write

  DonationSimulateFunction:
    Type: AWS::Serverless::Function
    Condition: IsAcademicStage
    Properties:
      CodeUri: ../backend/
      Handler: dist/donations/simulate.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt DonationsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ProjectsTable.Arn
      Events:
        SimulateDonation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations/{donationId}/simulate
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - api/donations.write

  DonationListMineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/donations/listMine.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${DonationsTable.Arn}/index/DonorSubCreatedAtIndex"
      Events:
        ListMine:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations/me
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - api/donations.read

Outputs:
  ApiEndpoint:
    Description: URL del API Gateway HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "DonationsApiEndpoint-${Stage}"

  UserPoolId:
    Description: ID del User Pool de Cognito
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Client ID del User Pool Client para la SPA
    Value: !Ref UserPoolClient

  CognitoAuthority:
    Description: Authority OIDC de Cognito
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

